{% load menu_tags %}
<div class="flat-menu {{ menu_handle }} {% if menu_heading %}with_heading{% else %}no_heading{% endif %} mt-4 grid grid-cols-12 gap-4">
    {% if show_menu_heading and menu_heading %}<h4>{{ menu_heading|safe }}</h4>{% endif %}
    {% if menu_items %}
    <div class="col-span-1 md:col-span-8"></div>
    <ul class="col-span-11 flex flex-col md:col-span-4">
        {% for item in menu_items %}
        <li class="{{ item.active_class }} flex min-h-10 flex-1">
            <a href="{{ item.href }}" class="flex min-h-14 flex-1 items-center gap-4 px-4 py-2 text-[0.9em] whitespace-nowrap text-white">{{ item.text }}</a>
            {% if item.has_children_in_menu %}{% sub_menu item %}{% endif %}
        </li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
