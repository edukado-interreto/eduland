{% load static ftl menu_tags %}
<footer class="grid min-h-20 content-center bg-secondary-gradient">
  <br class="m-6">
  {% flat_menu "footer" %}
  <br class="m-6">
  <div class="mt-4 flex flex-wrap items-center justify-evenly gap-4">
    <div class="h-32 flex-none aspect-[2/1]">
      <a href="https://www.inalco.fr" target="_blank" aria-label="{% ftlmsg 'app-inalco-website' %}" class="inline-flex w-full items-center justify-center rounded-lg">
        <img class="mx-auto size-full max-h-32 rounded-lg object-cover" src="{% static 'inalco_logo.avif' %}" decoding="async" loading="lazy" role="presentation">
      </a>
    </div>
    <div class="size-32 flex-none rounded-full bg-[#4facfe]">
      <a href="https://ikso.net" target="_blank" aria-label="{% ftlmsg 'app-ikso-website' %}" class="block size-full rounded-full">
        <img class="block size-full max-h-32 rounded-full" height="112" src="{% static "ikso_emblemo_blanka.avif" %}" decoding="async" loading="lazy" role="presentation">
      </a>
    </div>
    <div class="size-32 flex-none rounded-full bg-white p-2">
      <a href="https://horvatha.edupage.org" target="_blank" aria-label="{% ftlmsg 'app-horvatha-website' %}" class="block size-full rounded-full">
        <img class="block size-full max-h-32 rounded-full" height="100" src="{% static "GIH_logo.svg" %}" decoding="async" loading="lazy" role="presentation">
      </a>
    </div>
    <div class="flex h-32 flex-none items-center rounded-lg bg-white p-2">
      <a href="https://erasmus-plus.ec.europa.eu" target="_blank" aria-label="{% ftlmsg 'app-erasmus-plus-website' %}" class="flex items-center justify-center rounded-lg">
        <img class="mx-auto h-auto max-h-32 w-full max-w-[calc(1rem+min(420px,80vw))] rounded-lg object-cover" src="{% static "Co-funded-by-the-EU.avif" %}" decoding="async" loading="lazy" role="presentation">
      </a>
    </div>
  </div>
  <nav class="mt-4 flex min-h-20 items-center justify-center gap-4 text-center text-white opacity-50">
    <small>&copy; {% ftlmsg "app-project-name" %} {% now "Y" %}</small>
  </nav>
</footer>
