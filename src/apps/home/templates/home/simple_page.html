{% extends "layout/base.html" %}
{% load static wagtailcore_tags wagtailimages_tags %}
{% block main_class %}w-full{% endblock %}

{% block content %}
<div class="-mt-4 mb-16 bg-secondary-gradient py-8 text-white shadow-elevate-2">
  <h1 class="mx-auto my-[4vh] max-w-page text-center font-bold">{{ self.title }}</h1>
</div>

<section class="mt-[4vh]">
  <article class="card flow mx-auto my-[5vh] min-h-[50vh] max-w-page bg-white text-indigo shadow-none">
    {{ self.content | richtext }}
  </article>
</section>
{% endblock content %}
