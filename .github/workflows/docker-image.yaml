name: Docker Image Build and Push

on:
  push:
    branches: [ "main" ]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: eduland
          POSTGRES_USER: eduland
          POSTGRES_PASSWORD: eduland
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eduland"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev --group test

      - name: Run tests
        working-directory: src
        env:
          EDULAND_DATABASE_URL: postgres://eduland:_@localhost:5432/eduland
          EDULAND_POSTGRES_PASSWORD: eduland
        run: uv run --no-sync pytest --cov-report markdown-append:$GITHUB_STEP_SUMMARY

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Commit Hash Tag
        id: commit_tag_gen
        run: |
          echo "SHORT_COMMIT_HASH_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "COMMIT_HASH_TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Generate Date Tag
        id: date_tag_gen
        run: |
          echo "DATE_TAG=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile
          target: production
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_HASH_TAG=${{ steps.commit_tag_gen.outputs.COMMIT_HASH_TAG }}
          tags: |
            ghcr.io/${{ github.repository }}/django:latest
            ghcr.io/${{ github.repository }}/django:${{ steps.date_tag_gen.outputs.DATE_TAG }}
            ghcr.io/${{ github.repository }}/django:${{ steps.commit_tag_gen.outputs.COMMIT_HASH_TAG }}
            ghcr.io/${{ github.repository }}/django:${{ steps.commit_tag_gen.outputs.SHORT_COMMIT_HASH_TAG }}
