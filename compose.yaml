name: "eduland"

secrets:
  postgres-password:
    file: ./containers/secrets/postgres-password

services:
  proxy:
    image: caddy:alpine
    user: ${USER_ID:-1000}:${GROUP_ID:-1000}
    environment:
      - CADDY_HOSTS=${CADDY_HOSTS}
      - PORT=${PORT:-8000}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./containers/caddy/data:/data:z
      - ./etc/caddy:/etc/caddy:z
      - ./uploads:/srv/uploads:z
    networks:
      - public
      - backend

  django:
    build:
      context: .
      dockerfile: ./containers/Containerfile
      target: development
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    user: ${USER_ID:-1000}:${GROUP_ID:-1000}
    command: /bin/sh -c "./manage.py migrate && ./manage.py serve"
    secrets:
      - source: postgres-password
        target: POSTGRES_PASSWORD
    networks:
      - backend
    volumes:
      - ./src:/app:z
      - ./uploads:/app/uploads:z
    ports:
      - 127.0.0.1:$PORT:$PORT
    env_file:
      - ./src/config/.env
    depends_on:
      - proxy
      - postgres
    restart: unless-stopped
    stop_grace_period: 1s

  postgres:
    image: postgres:18-alpine
    secrets:
      - postgres-password
    networks:
      - backend
    user: ${USER_ID:-1000}:${GROUP_ID:-1000}
    volumes:
      - ./containers/db/postgresql:/var/lib/postgresql:z
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres-password
    restart: unless-stopped

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - 127.0.0.1:8080:8080
    networks:
      - backend

networks:
  public:
  backend:
